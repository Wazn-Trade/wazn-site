name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Sync @wazn/brand into assets/css/, bundle tokens+site, then run every
    # other gate off the artifact that the pages actually load.
    name: Sync brand + bundle CSS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@wazn"

      - name: npm ci (reads @wazn/brand from GH Packages)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Sync brand CSS into assets/css/
        run: npm run sync-brand

      - name: Fail on drift (assets/css/ must match what npm ci produces)
        # If a developer forgot to re-sync after bumping @wazn/brand, catch it here.
        run: git diff --exit-code assets/css/tokens.css assets/css/components.css

      - name: Bundle tokens.css + site.css -> bundle.css
        run: npm run bundle-css

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: wazn-site-built
          path: |
            .
            !node_modules
            !.git

  validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML
        run: npx --yes html-validate index.html en/index.html 404.html

  links:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'api\.wazn\.trade'
            --exclude 'mailto:'
            index.html en/index.html 404.html
          fail: true

  a11y:
    name: pa11y (WCAG2AA)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@wazn"

      - name: npm ci + build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build

      - name: Serve site
        run: |
          python3 -m http.server 8080 &
          sleep 1

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci@3

      - name: Run pa11y
        run: >-
          pa11y-ci
          --standard WCAG2AA
          http://localhost:8080/
          http://localhost:8080/en/
          http://localhost:8080/404.html
