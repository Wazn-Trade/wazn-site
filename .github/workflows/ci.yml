name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Sync @wazn-trade/brand into assets/css/, bundle tokens+site, then run every
    # other gate off the artifact that the pages actually load.
    #
    # CI avoids the GH Packages cross-repo auth dance by installing the brand
    # from the sibling `wazn-brand/` checkout (same org, same push). Production
    # builds on Cloudflare Pages use the published package from GH Packages.
    name: Sync brand + bundle CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wazn-Trade/wazn-brand
          path: wazn-brand

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install (brand from sibling checkout, CI only)
        run: |
          npm pkg set 'dependencies.@wazn-trade/brand'='file:./wazn-brand'
          npm install --no-audit --no-fund

      - name: Sync brand CSS into assets/css/
        run: npm run sync-brand

      - name: Fail on drift (assets/css/ must match what npm ci produces)
        # If a developer forgot to re-sync after bumping @wazn-trade/brand, catch it here.
        run: git diff --exit-code assets/css/tokens.css assets/css/components.css

      - name: Bundle tokens.css + site.css -> bundle.css
        run: npm run bundle-css

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: wazn-site-built
          path: |
            .
            !node_modules
            !.git

  validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML
        run: npx --yes html-validate index.html en/index.html 404.html

  links:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Serve from the repo root so root-relative /assets/… and /en/… resolve.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude 'api\.wazn\.trade'
            --exclude 'mailto:'
            --exclude 'assets/css/bundle\.css'
            index.html en/index.html 404.html
          fail: true

  a11y:
    name: pa11y (WCAG2AA)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wazn-Trade/wazn-brand
          path: wazn-brand
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install + build
        run: |
          npm pkg set 'dependencies.@wazn-trade/brand'='file:./wazn-brand'
          npm install --no-audit --no-fund
          npm run build

      - name: Serve site
        run: |
          python3 -m http.server 8080 &
          sleep 1

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci@3

      - name: Run pa11y
        run: >-
          pa11y-ci
          --standard WCAG2AA
          http://localhost:8080/
          http://localhost:8080/en/
          http://localhost:8080/404.html
